name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DEVELOPER_DIR: /Applications/Xcode_15.0.app/Contents/Developer

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-13
    
    strategy:
      matrix:
        destination: 
          - 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0'
          - 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=17.0'
          - 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation),OS=17.0'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v3
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Install dependencies
      run: |
        # Install any required tools
        brew install swiftlint || true
    
    - name: SwiftLint
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint --reporter github-actions-logging || true
        else
          echo "SwiftLint not installed, skipping..."
        fi
    
    - name: Build
      run: |
        xcodebuild clean build \
          -project AppIconMaker.xcodeproj \
          -scheme AppIconMaker \
          -destination '${{ matrix.destination }}' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
    
    - name: Run Tests
      run: |
        xcodebuild test \
          -project AppIconMaker.xcodeproj \
          -scheme AppIconMaker \
          -destination '${{ matrix.destination }}' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -enableCodeCoverage YES \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: true
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.destination }}
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
    
    - name: Generate Code Coverage
      run: |
        xcrun xccov view --report --json \
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult > coverage.json || true
      continue-on-error: true
    
    - name: Upload Coverage
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-${{ matrix.destination }}
        path: coverage.json
      continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      run: |
        swiftlint lint --reporter github-actions-logging
      continue-on-error: true
    
    - name: Check for TODO/FIXME
      run: |
        echo "Checking for TODO and FIXME comments..."
        grep -r "TODO\|FIXME" AppIconMaker/ || echo "No TODO/FIXME found"
      continue-on-error: true

  build-archive:
    name: Build Archive
    runs-on: macos-13
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Build Archive
      run: |
        xcodebuild archive \
          -project AppIconMaker.xcodeproj \
          -scheme AppIconMaker \
          -archivePath ./build/AppIconMaker.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
      continue-on-error: true
    
    - name: Upload Archive
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: app-archive
        path: ./build/AppIconMaker.xcarchive
        retention-days: 7

  performance-check:
    name: Performance Analysis
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Build for Profiling
      run: |
        xcodebuild build \
          -project AppIconMaker.xcodeproj \
          -scheme AppIconMaker \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
      continue-on-error: true
    
    - name: Check Binary Size
      run: |
        if [ -d "~/Library/Developer/Xcode/DerivedData" ]; then
          find ~/Library/Developer/Xcode/DerivedData -name "AppIconMaker.app" -type d | while read app; do
            echo "App size:"
            du -sh "$app"
          done
        fi
      continue-on-error: true
