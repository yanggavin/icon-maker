# SwiftLint Configuration for App Icon Maker

# Paths to include/exclude
included:
  - AppIconMaker

excluded:
  - Pods
  - .build
  - DerivedData
  - .kiro

# Rules
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  - todo # Allow TODO comments during development
  - line_length # Can be too strict for SwiftUI
  - type_body_length # SwiftUI views can be long

# Rule Configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - r
    - g
    - b
    - a

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 50

# Custom Rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "print\\("
    message: "Use proper logging instead of print()"
    severity: warning
  
  no_force_unwrap:
    name: "No Force Unwrapping"
    regex: "!(?![=])"
    message: "Avoid force unwrapping, use optional binding instead"
    severity: warning
    excluded: ".*Tests\\.swift"
  
  no_force_cast:
    name: "No Force Casting"
    regex: "as!"
    message: "Avoid force casting, use conditional casting instead"
    severity: warning
    excluded: ".*Tests\\.swift"

# Reporter
reporter: "github-actions-logging"
