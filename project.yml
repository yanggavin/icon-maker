name: AppIconMaker
options:
  bundleIdPrefix: tech.newtree
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true
  
targets:
  AppIconMaker:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - AppIconMaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.newtree.icon-maker
        INFOPLIST_FILE: AppIconMaker/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SDKROOT: iphoneos
        Release:
          SDKROOT: iphoneos
    dependencies:
      - framework: Vision.framework
        embed: false
      - framework: CoreImage.framework
        embed: false
      - framework: PhotosUI.framework
        embed: false
